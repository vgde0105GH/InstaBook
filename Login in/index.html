<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <title>Login</title>
</head>

<body>

    <div class="container">

        <div class="login-card">

            <h2>Login</h2>

            <form action="">

                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <input type="text" placeholder="Tag(#)">

                </div>


                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-unlock"></i>
                    </span>

                    <input type="password" placeholder="Senha">

                </div>


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>

                    <a href="" class="link">
                        Esqueceu a senha?
                    </a>

                </div>


                <button class="bnt">
                    Entrar
                </button>

            </form>


            <p class="link-p">

                <a href="" class="link">
                    Não tem uma conta
                </a>

            </p>

        </div>

    </div>

</body>

</html>
