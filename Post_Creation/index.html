<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar Post - InstaBook</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="container">

        <div class="formulario card">

            <h1 class="page-title">
                Criar novo post
            </h1>

            <p class="page-subtitle">
                Compartilhe algo com outras pessoas
            </p>


            <form>

                <label for="titulo">
                    Título
                </label>

                <input
                    class="input"
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título do post"
                    required
                >


                <label for="conteudo">
                    Conteúdo
                </label>

                <textarea
                    class="input"
                    id="conteudo"
                    name="conteudo"
                    placeholder="Escreva o conteúdo do seu post..."
                    required
                ></textarea>


                <label for="imagem">
                    Adicionar imagem
                </label>

                <input
                    type="file"
                    id="imagem"
                    name="imagem"
                    accept="image/*"
                >


                <div class="botoes">

                    <button
                        type="submit"
                        class="primary-button btn-enviar"
                    >
                        Enviar post
                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="cancelButton"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
