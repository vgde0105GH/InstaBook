<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>InstaBook - Feed</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS DO FEED -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <aside class="sidebar">

        <div class="logo">

            <span>◎</span>

            InstaBook

        </div>


        <div class="user-profile">

            <div class="profile-picture">
                V
            </div>

            <div>

                <strong>
                    Victor Oliveira
                </strong>

                <span>
                    @victor
                </span>

            </div>

        </div>


        <nav class="sidebar-menu">

            <button
                class="menu-item active"
                data-page="feed"
            >

                <span>⌂</span>

                Feed

            </button>


            <button
                class="menu-item"
                data-page="create"
            >

                <span>＋</span>

                Criar publicação

            </button>


            <button
                class="menu-item"
                data-page="liked"
            >

                <span>♥</span>

                Posts curtidos

            </button>


            <button
                class="menu-item"
                data-page="profile"
            >

                <span>●</span>

                Meu perfil

            </button>

        </nav>


        <div class="sidebar-bottom">

            <button class="menu-item">

                <span>⚙</span>

                Configurações

            </button>


            <button class="menu-item">

                <span>↪</span>

                Sair

            </button>

        </div>

    </aside>


    <main class="main-content">


        <header class="top-bar">

            <div>

                <h1>
                    Feed
                </h1>

                <p>
                    Veja as publicações dos seus amigos
                </p>

            </div>


            <div class="top-profile">

                <div class="small-profile">
                    V
                </div>

            </div>

        </header>


        <section
            id="feedPage"
            class="page"
        >

            <div id="postsContainer">

            </div>

        </section>


        <section
            id="postPage"
            class="page hidden"
        >

            <button
                id="backButton"
                class="back-button"
            >

                ← Voltar para o feed

            </button>


            <div id="fullPostContainer">

            </div>

        </section>


        <section
            id="otherPage"
            class="page hidden"
        >

            <div class="empty-page">

                <div class="empty-icon">
                    🚧
                </div>

                <h2>
                    Página em desenvolvimento
                </h2>

                <p>
                    Essa parte será criada posteriormente.
                </p>

                <button
                    id="returnFeedButton"
                    class="primary-button"
                >

                    Voltar para o feed

                </button>

            </div>

        </section>

    </main>


    <script src="./script.js"></script>

</body>

</html>
