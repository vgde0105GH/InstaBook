<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comentários - InstaBook</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="comments-container">

        <!-- CABEÇALHO -->

        <header class="comments-header">

            <button
                class="voltar"
                id="backButton"
            >
                ‹
            </button>

            <h1>
                Comentários
            </h1>

            <button
                class="enviar"
                id="sendButton"
            >
                ➤
            </button>

        </header>


        <!-- LISTA DE COMENTÁRIOS -->

        <div
            class="comments-list"
            id="commentsList"
        >

            <!-- COMENTÁRIO 1 -->

            <div
                class="comment"
                data-comment-id="1"
            >

                <div class="avatar avatar-roxo">
                    👩‍🦳
                </div>

                <div class="comment-content">

                    <div class="comment-text">

                        <strong>
                            john.doe
                        </strong>

                        Lorem ipsum dolor sit, amet consectetur
                        adipiscing elit. Lorem ipsum dolor sit.

                    </div>

                    <div class="comment-info">

                        <span>
                            22/09/2026 18:30
                        </span>

                        <button class="comment-action">
                            Responder
                        </button>

                        <button class="comment-action edit-button">
                            Editar
                        </button>

                        <button class="comment-action delete-button">
                            Excluir
                        </button>

                    </div>

                </div>

                <button class="like">
                    ♡
                </button>

            </div>


            <!-- COMENTÁRIO 2 -->

            <div
                class="comment"
                data-comment-id="2"
            >

                <div class="avatar avatar-azul">
                    👩
                </div>

                <div class="comment-content">

                    <div class="comment-text">

                        <strong>
                            random.person
                        </strong>

                        Hahahahahah

                    </div>

                    <div class="comment-info">

                        <span>
                            22/09/2026 17:45
                        </span>

                        <button class="comment-action">
                            Responder
                        </button>

                        <button class="comment-action edit-button">
                            Editar
                        </button>

                        <button class="comment-action delete-button">
                            Excluir
                        </button>

                    </div>

                </div>

                <button class="like">
                    ♡
                </button>

            </div>


            <!-- COMENTÁRIO 3 -->

            <div
                class="comment"
                data-comment-id="3"
            >

                <div class="avatar avatar-vermelho">
                    👨
                </div>

                <div class="comment-content">

                    <div class="comment-text">

                        <strong>
                            deesan.tutorials
                        </strong>

                        Hey folks!!!

                    </div>

                    <div class="comment-info">

                        <span>
                            22/09/2026 16:20
                        </span>

                        <button class="comment-action">
                            Responder
                        </button>

                        <button class="comment-action edit-button">
                            Editar
                        </button>

                        <button class="comment-action delete-button">
                            Excluir
                        </button>

                    </div>

                </div>

                <button class="like">
                    ♡
                </button>

            </div>

        </div>


        <!-- CAMPO DE NOVO COMENTÁRIO -->

        <div class="new-comment">

            <input
                type="text"
                id="commentInput"
                class="input"
                placeholder="Adicione um comentário..."
            >

            <button
                class="primary-button"
                id="addCommentButton"
            >
                Publicar
            </button>

        </div>

    </div>


    <script src="./script5.js"></script>

</body>

</html>
