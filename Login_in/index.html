<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS ESPECÍFICO DO LOGIN -->
    <link rel="stylesheet" href="./style.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <title>Login - InstaBook</title>

</head>


<body>

    <main class="container">

        <div class="login-card">

            <h1>
                Login
            </h1>

            <p class="subtitle">
                Entre na sua conta do InstaBook
            </p>


            <form id="loginForm">


                <!-- TAG -->

                <div class="input-box">

                    <span class="icon">

                        <i class="fa-solid fa-at"></i>

                    </span>

                    <input
                        type="text"
                        id="tag"
                        name="tag"
                        placeholder="Tag (#)"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="input-box">

                    <span class="icon">

                        <i class="fa-solid fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required
                    >

                </div>


                <!-- OPÇÕES -->

                <div class="options">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Lembrar-me

                    </label>


                    <a
                        href="#"
                        class="link"
                    >
                        Esqueceu a senha?
                    </a>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn"
                >
                    Entrar
                </button>


            </form>


            <!-- CADASTRO -->

            <p class="link-p">

                Não tem uma conta?

                <a
                    href="../Sign_in/index.html"
                    class="link"
                >
                    Criar conta
                </a>

            </p>


        </div>

    </main>


    <script src="./script.js"></script>

</body>

</html>
