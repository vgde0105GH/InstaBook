<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar Conta - InstaBook</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="./style.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

</head>


<body>

    <main class="container">

        <div class="sign-card">

            <h1>
                Criar conta
            </h1>

            <p 
             class="subtitle">
             Crie sua conta no InstaBook
            </p>


            <form id="signForm">


                <!-- EMAIL -->

                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required
                    >

                </div>


                <!-- TAG -->

                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-at"></i>
                    </span>

                    <input
                        type="text"
                        id="tag"
                        name="tag"
                        placeholder="Tag (#)"
                        required
                    >

                </div>


                <!-- NOME -->

                <div class="input-box">

                    <span class="icon">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Nome"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn"
                >
                    Criar Conta
                </button>


            </form>


            <p class="login-text">

                Já possui uma conta?

                <a 
                 href="../Login in/index.html">
                 Entrar
                </a>

            </p>


        </div>

    </main>


    <script src="./script.js"></script>

</body>

</html>
